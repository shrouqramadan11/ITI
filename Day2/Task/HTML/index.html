<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <header>

        <nav>
                <a href="#">Main</a>
                <a href="#">Make an Order</a>
                <a href="#">Contact Us</a>
        </nav>

        <h1>Black Goose Bistro | Pizza On Demand</h1>

        <p>
            Our 12
            <blockquote>
                "wood fired pizza are available for delivery, build your custom pizza and we will deliver it within an hour"
            </blockquote>
        </p>

    </header>


    <section>

        <form>

            <fieldset>

                <legend>Your information</legend>

                <table>

                    <tr>
                        <td>
                            <label for="name">Name:</label>
                        </td>
                        <td>
                            <input type="text" id="name" name="name">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="address">Address:</label>
                        </td>
                        <td>
                            <input type="text" id="address" name="address">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="phone">Telephone number:</label>
                        </td>
                        <td>
                            <input type="tel" id="phone" name="phone">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="email">Email:</label>
                        </td>
                        <td>
                            <input type="email" id="email" name="email">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="delivery-instructions">
                                Delivery instructions:
                            </label>
                        </td>
                        <td>
                            <textarea
                                name="delivery-instructions"
                                id="delivery-instructions"
                                placeholder="No more than 400 characters long..."
                                maxlength="400">
                            </textarea>
                        </td>
                    </tr>

                </table>

            </fieldset>

        </form>

    </section>


    <section>

        <h2>Design your dream pizza</h2>

        <form>

            <fieldset>

                <legend>Pizza specs</legend>


                <fieldset>

                    <legend>Crust (choose one):</legend>

                    <table>

                        <tr>
                            <td>
                                <label for="classic-white">Classic white</label>
                            </td>
                            <td>
                                <input
                                    type="radio"
                                    id="classic-white"
                                    name="crust"
                                    value="classic-white">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="multigrain">Multigrain</label>
                            </td>
                            <td>
                                <input
                                    type="radio"
                                    id="multigrain"
                                    name="crust"
                                    value="multigrain">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="stuffed">Choose stuffed crust</label>
                            </td>
                            <td>
                                <input
                                    type="radio"
                                    id="stuffed"
                                    name="crust"
                                    value="stuffed">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="gluten">Gluten-free</label>
                            </td>
                            <td>
                                <input
                                    type="radio"
                                    id="gluten"
                                    name="crust"
                                    value="gluten">
                            </td>
                        </tr>

                    </table>

                </fieldset>


                <fieldset>

                    <legend>Toppings (choose up to 3):</legend>

                    <table>

                        <tr>
                            <td>
                                <label for="red">Red Sauce</label>
                            </td>
                            <td>
                                <input
                                    type="checkbox"
                                    id="red"
                                    name="toppings"
                                    value="red">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="green">Green Peppers</label>
                            </td>
                            <td>
                                <input
                                    type="checkbox"
                                    id="green"
                                    name="toppings"
                                    value="green">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="pepperoni">Pepperoni</label>
                            </td>
                            <td>
                                <input
                                    type="checkbox"
                                    id="pepperoni"
                                    name="toppings"
                                    value="pepperoni">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="mozzarella">Mozzarella Cheese</label>
                            </td>
                            <td>
                                <input
                                    type="checkbox"
                                    id="mozzarella"
                                    name="toppings"
                                    value="mozzarella">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="mushrooms">Mushrooms</label>
                            </td>
                            <td>
                                <input
                                    type="checkbox"
                                    id="mushrooms"
                                    name="toppings"
                                    value="mushrooms">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="white">White sauce</label>
                            </td>
                            <td>
                                <input
                                    type="checkbox"
                                    id="white"
                                    name="toppings"
                                    value="white">
                            </td>
                        </tr>

                    </table>

                </fieldset>


                <fieldset>

                    <legend>Number</legend>

                    <table>

                        <tr>
                            <td>
                                <label for="number">
                                    How many pizzas would you like to order?
                                </label>
                            </td>

                            <td>
                                <input
                                    type="number"
                                    id="number"
                                    name="number"
                                    min="1"
                                    max="10">
                            </td>
                        </tr>

                    </table>

                </fieldset>

                <br>

                <button type="submit">Bring me pizza</button>
                <input type="reset" value="Reset">

            </fieldset>

        </form>

    </section>


    <script src="../JS/Script.js"></script>

</body>

</html>
