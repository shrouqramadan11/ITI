<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Personal Profile</title>
</head>

<body>

    <h1>Shrouq Ramadan</h1>

    <img src="../assets/cat2.jfif" alt="cat" width="300" height="300">

    <p>My name is Shrouq and I am a Web Developer. I have experience in creating responsive websites and developing interactive user interfaces.</p>

    <table border="1">
        <tr>
            <th>Skill</th>
            <th>Level</th>
        </tr>

        <tr>
            <td>HTML</td>
            <td>Advanced</td>
        </tr>

        <tr>
            <td>CSS</td>
            <td>Advanced</td>
        </tr>

        <tr>
            <td>JavaScript</td>
            <td>Beginner</td>
        </tr>
    </table>

    <br>

    <form>

        <label for="name">Name:</label>
        <input 
            type="text" 
            id="name" 
            placeholder="Enter your name"
        >

        <br><br>

        <label for="email">Email:</label>
        <input 
            type="email" 
            id="email" 
            placeholder="Enter your email"
        >

        <br><br>

        <label for="reason">Reason:</label>

        <select id="reason">
            <option>Feedback</option>
            <option>Job Opportunity</option>
            <option>Question</option>
            <option>Other</option>
        </select>

        <br><br>

        <label for="message">Message:</label>
        <br>

        <textarea 
            id="message" 
            rows="5" 
            cols="40"
            placeholder="Type your message here..."
        ></textarea>

        <br><br>

        <input type="submit" value="Send Message">

    </form>

</body>

</html>
